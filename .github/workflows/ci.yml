name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.prefer-lowest && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        prefer-lowest: [false]
        include:
          - php: '8.2'
            prefer-lowest: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: ${{ matrix.php == '8.3' && !matrix.prefer-lowest && 'xdebug' || 'none' }}
          ini-values: error_reporting=E_ALL

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.prefer-lowest }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.prefer-lowest }}-
            composer-${{ runner.os }}-${{ matrix.php }}-
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install lowest dependencies
        if: matrix.prefer-lowest
        run: composer update --prefer-lowest --prefer-stable --no-progress

      - name: Run security audit
        run: composer audit

      - name: Run code style check
        run: composer cs

      - name: Run static analysis
        run: composer phpstan

      - name: Run tests
        run: composer test

      - name: Run tests with coverage
        if: matrix.php == '8.3' && !matrix.prefer-lowest
        run: vendor/bin/phpunit --coverage-clover build/logs/clover.xml

      - name: Check coverage threshold
        if: matrix.php == '8.3' && !matrix.prefer-lowest
        run: |
          php -r '
          $xml = simplexml_load_file("build/logs/clover.xml");
          $metrics = $xml->project->metrics;
          $elements = (int)$metrics["elements"];
          $coveredElements = (int)$metrics["coveredelements"];
          $coverage = ($elements > 0) ? ($coveredElements / $elements) * 100 : 0;
          echo "Coverage: " . number_format($coverage, 2) . "%\n";
          if ($coverage < 90.0) {
            echo "Error: Coverage is below threshold of 90%\n";
            exit(1);
          }
          '

      - name: Upload coverage to Code Climate
        if: matrix.php == '8.3' && !matrix.prefer-lowest && github.event_name == 'push'
        uses: paambaati/codeclimate-action@v9
        continue-on-error: true
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        with:
          coverageLocations: ${{ github.workspace }}/build/logs/clover.xml:clover

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: pcov
          ini-values: error_reporting=E_ALL

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run mutation testing
        run: composer infection
